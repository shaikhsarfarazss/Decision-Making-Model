<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube — StudyShield 20-Category Live Sandbox</title>
  <link rel="stylesheet" href="extension/overlay.css" />
  <style>
    :root {
      --yt-bg: #0f0f0f;
      --yt-card: #181818;
      --yt-border: #272727;
      --yt-text: #f1f1f1;
      --yt-muted: #aaaaaa;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Roboto, Arial, sans-serif; }
    body { background: var(--yt-bg); color: var(--yt-text); padding-bottom: 60px; }

    /* Simulated YouTube Masthead */
    .yt-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(15, 15, 15, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--yt-border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .yt-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .yt-logo-pill {
      background: #ff0000;
      color: #fff;
      padding: 4px 10px;
      border-radius: 7px;
      font-size: 14px;
    }
    .sandbox-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .mode-btn {
      background: #272727;
      color: #f1f1f1;
      border: 1px solid #3f3f3f;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.18s;
    }
    .mode-btn:hover, .mode-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #fff;
    }

    /* Quick Category Filter Chips Bar */
    .yt-chips-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 24px;
      border-bottom: 1px solid var(--yt-border);
      background: #121212;
    }
    .yt-chip {
      background: #272727;
      color: #e2e8f0;
      border: 1px solid rgba(255,255,255,0.08);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }
    .yt-chip.selected {
      background: rgba(56, 189, 248, 0.2);
      border-color: #38bdf8;
      color: #38bdf8;
    }

    .section-heading {
      padding: 22px 24px 12px;
      font-size: 18px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Simulated YouTube Rich Grid */
    .yt-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 20px;
      padding: 0 24px;
    }
    ytd-rich-item-renderer {
      display: block;
      background: var(--yt-card);
      border: 1px solid var(--yt-border);
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.2s;
    }
    .thumb-box {
      height: 162px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      position: relative;
      background: linear-gradient(135deg, #1e293b, #0f172a);
    }
    .duration {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .meta-box {
      padding: 12px 14px 16px;
    }
    #video-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--yt-text);
      line-height: 1.4;
      margin-bottom: 6px;
      display: block;
      text-decoration: none;
    }
    #channel-name {
      font-size: 12px;
      color: var(--yt-muted);
      font-weight: 500;
    }

    /* Simulated YouTube Shorts Shelf */
    .shorts-row {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
      gap: 16px;
      padding: 0 24px;
    }
    ytm-shorts-lockup-view-model {
      display: block;
      background: var(--yt-card);
      border: 1px solid var(--yt-border);
      border-radius: 14px;
      overflow: hidden;
    }
    .shortsLockupViewModelHostThumbnailContainer {
      height: 270px;
      background: linear-gradient(160deg, #31102f, #0f172a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 46px;
    }
    .shortsLockupViewModelHostOutsideMetadata {
      padding: 10px 12px 14px;
    }
    .shortsLockupViewModelHostOutsideMetadataTitle {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.35;
      color: #fff;
    }
    .shortsLockupViewModelHostMetadataSubhead {
      font-size: 11px;
      color: var(--yt-muted);
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <header class="yt-header">
    <div class="yt-logo">
      <span class="yt-logo-pill">▶ YouTube</span>
      <span>StudyShield 20-Category Test Feed</span>
    </div>
    <div class="sandbox-controls">
      <button class="mode-btn" onclick="applySandboxPreset(['study'])">📚 Study Only</button>
      <button class="mode-btn" onclick="applySandboxPreset(['coding'])">💻 Code Only</button>
      <button class="mode-btn" onclick="applySandboxPreset(['study','coding'])">🎓 Study + Code</button>
      <button class="mode-btn" onclick="applySandboxPreset('all')">✅ Allow All 20</button>
      <button class="mode-btn" onclick="applySandboxPreset([])">🚫 Block All</button>
    </div>
  </header>

  <div class="yt-chips-bar" id="chipsBar"></div>

  <div class="section-heading">📺 Home Feed — 20 YouTube Content Categories</div>
  <div class="yt-grid" id="videoGrid"></div>

  <div class="section-heading">⚡ YouTube Shorts Shelf (Real-Time Interception)</div>
  <div class="shorts-row" id="shortsGrid"></div>

  <script>
    const ALL_CATEGORIES = [
      { tag: 'study', label: '📚 Study & Exams' },
      { tag: 'coding', label: '💻 Coding & Dev' },
      { tag: 'tech', label: '🔧 Tech & Gadgets' },
      { tag: 'scifi', label: '🚀 Science & Space' },
      { tag: 'news', label: '📰 News & Politics' },
      { tag: 'finance', label: '📈 Finance & Biz' },
      { tag: 'howto', label: '🛠️ How-To & DIY' },
      { tag: 'podcast', label: '🎙️ Podcasts & Talks' },
      { tag: 'cooking', label: '🍲 Cooking & Food' },
      { tag: 'autos', label: '🚗 Autos & Vehicles' },
      { tag: 'pets', label: '🐾 Pets & Nature' },
      { tag: 'travel', label: '✈️ Travel & Culture' },
      { tag: 'music', label: '🎵 Music & Lofi' },
      { tag: 'sports', label: '🏏 Sports & Fitness' },
      { tag: 'anime', label: '⚔️ Anime & Manga' },
      { tag: 'cartoon', label: '🎨 Cartoon & Animation' },
      { tag: 'gaming', label: '🎮 Gaming & Esports' },
      { tag: 'vlog', label: '💄 Vlogs & Lifestyle' },
      { tag: 'comedy', label: '😂 Comedy & Memes' },
      { tag: 'clickbait', label: '🚨 Clickbait & Drama' }
    ];

    const SAMPLE_VIDEOS = [
      { id: 'v1', icon: '📐', dur: '48:12', title: 'Calculus 3: Multiple Integrals and Vector Fields Lecture 12', channel: 'MIT OpenCourseWare' },
      { id: 'v2', icon: '⚡', dur: '34:20', title: 'Operating Systems - Process Scheduling Algorithms (FCFS, SJF, Round Robin)', channel: 'Gate Smashers' },
      { id: 'v3', icon: '🐍', dur: '1:15:00', title: 'FastAPI Crash Course: Build REST APIs with Python', channel: 'Traversy Media' },
      { id: 'v4', icon: '🧠', dur: '28:45', title: 'ModernBERT Architecture and Bidirectional Attention Deep Dive', channel: 'Yannic Kilcher' },
      { id: 'v5', icon: '🌳', dur: '19:10', title: 'Decision Trees, Entropy, and Information Gain Walkthrough', channel: 'Krish Naik' },
      { id: 'v6', icon: '🐙', dur: '42:00', title: 'Git & GitHub Crash Course for Students & Beginners', channel: 'Fireship' },
      { id: 'v7', icon: '💻', dur: '14:22', title: 'Custom Gaming PC Build Guide RTX 5090 & Linux Ubuntu Setup', channel: 'Linus Tech Tips' },
      { id: 'v8', icon: '🌌', dur: '16:05', title: 'Interstellar Black Hole Physics & James Webb Telescope Cosmos', channel: 'Veritasium' },
      { id: 'v9', icon: '🌍', dur: '11:30', title: 'Breaking News: Global Geopolitics & Parliament Foreign Policy Debate', channel: 'WION' },
      { id: 'v10', icon: '📈', dur: '21:15', title: 'Stock Market Investing, Index Funds & Macroeconomics Explained', channel: 'Zerodha' },
      { id: 'v11', icon: '🛠️', dur: '15:40', title: 'How To Build a Second Brain in Notion & Obsidian Productivity DIY', channel: 'Ali Abdaal' },
      { id: 'v12', icon: '🎙️', dur: '2:12:00', title: 'Lex Fridman Podcast Full Episode: Deep Conversation on Future of Humanity', channel: 'Lex Fridman' },
      { id: 'v13', icon: '🍲', dur: '18:05', title: 'Authentic Hyderabadi Biryani Recipe & Street Food Kitchen MasterChef', channel: 'Ranveer Brar' },
      { id: 'v14', icon: '🏎️', dur: '13:50', title: 'Ferrari V12 Supercar vs Tesla Electric Vehicle Drag Race Car Review', channel: 'carwow' },
      { id: 'v15', icon: '🐾', dur: '52:00', title: 'Wild Animals of the Amazon Jungle Safari | Nature Documentary', channel: 'BBC Earth' },
      { id: 'v16', icon: '✈️', dur: '24:10', title: 'Solo Travel Guide Across Switzerland & Mountain Trekking Itinerary', channel: 'Drew Binsky' },
      { id: 'v17', icon: '🎵', dur: '1:00:00', title: 'Lofi Hip Hop Beats Playlist — Instrumental Chill Study Music', channel: 'Lofi Girl' },
      { id: 'v18', icon: '🏏', dur: '12:45', title: 'Cricket World Cup Final Super Over Thriller Match Highlights!', channel: 'ICC Official' },
      { id: 'v19', icon: '⚔️', dur: '23:50', title: 'Attack on Titan Season 4 & Jujutsu Kaisen Gojo Anime Opening', channel: 'Crunchyroll' },
      { id: 'v20', icon: '🎨', dur: '08:15', title: 'Tom and Jerry Classic Cartoon & Pixar 3D Animation Short', channel: 'WB Kids' },
      { id: 'v21', icon: '🎮', dur: '29:40', title: 'Valorant Pro Ranked Highlights: 50 Kills Radiant Ace Gameplay!', channel: 'TenZ' },
      { id: 'v22', icon: '💄', dur: '16:30', title: 'Day in My Life Daily Vlog & Minimalist Room Tour 2026', channel: 'Flying Beast' },
      { id: 'v23', icon: '😂', dur: '45:00', title: 'Stand-Up Comedy Special: Life After College & Prank Calling', channel: 'Samay Raina' },
      { id: 'v24', icon: '🚨', dur: '17:20', title: '$1 vs $1,000,000 Hotel Room! Shocking Secret Wealth Hack', channel: 'MrBeast' }
    ];

    const SAMPLE_SHORTS = [
      { id: 's1', icon: '🧮', title: 'Linear Algebra Eigenvalues Trick for GATE & JEE Exams #shorts', channel: '3Blue1Brown' },
      { id: 's2', icon: '⚛️', title: 'Python One-Liner & React JS Hook Every Developer Must Know #coding', channel: 'freeCodeCamp' },
      { id: 's3', icon: '🔫', title: 'INSANE 1v5 Clutch in Valorant Ranked Match! #gaming', channel: 'TenZ' },
      { id: 's4', icon: '🤣', title: 'Funniest Cat Fails of 2026 (Try Not to Laugh) #comedy', channel: 'AnimalMemes' },
      { id: 's5', icon: '💸', title: 'Shocking: He Was Arrested After Buying Everything Blindfolded!', channel: 'ViralDrama' }
    ];

    let activeSet = new Set(['study', 'coding']);

    function renderFilterChips() {
      const bar = document.getElementById('chipsBar');
      bar.innerHTML = '';
      ALL_CATEGORIES.forEach(c => {
        const chip = document.createElement('div');
        chip.className = 'yt-chip' + (activeSet.has(c.tag) ? ' selected' : '');
        chip.textContent = c.label;
        chip.onclick = () => {
          if (activeSet.has(c.tag)) activeSet.delete(c.tag);
          else activeSet.add(c.tag);
          renderFilterChips();
          broadcastSandboxPrefs();
        };
        bar.appendChild(chip);
      });
    }

    function applySandboxPreset(mode) {
      if (mode === 'all') activeSet = new Set(ALL_CATEGORIES.map(c => c.tag));
      else activeSet = new Set(mode);
      renderFilterChips();
      broadcastSandboxPrefs();
    }

    function broadcastSandboxPrefs() {
      window.postMessage({
        action: 'PREFERENCES_UPDATED',
        data: {
          shield_enabled: true,
          active_categories: Array.from(activeSet),
          custom_keywords: []
        }
      }, '*');
    }

    function renderFeeds() {
      const vGrid = document.getElementById('videoGrid');
      vGrid.innerHTML = SAMPLE_VIDEOS.map(v => `
        <ytd-rich-item-renderer id="${v.id}">
          <a href="/watch?v=${v.id}" id="thumbnail" title="${v.title}">
            <div class="thumb-box">${v.icon}<span class="duration">${v.dur}</span></div>
          </a>
          <div class="meta-box">
            <a href="/watch?v=${v.id}" id="video-title">${v.title}</a>
            <div id="channel-name">${v.channel}</div>
          </div>
        </ytd-rich-item-renderer>
      `).join('');

      const sGrid = document.getElementById('shortsGrid');
      sGrid.innerHTML = SAMPLE_SHORTS.map(s => `
        <ytm-shorts-lockup-view-model id="${s.id}">
          <a href="/shorts/${s.id}" class="shortsLockupViewModelHostEndpoint" title="${s.title}">
            <div class="shortsLockupViewModelHostThumbnailContainer">${s.icon}</div>
          </a>
          <div class="shortsLockupViewModelHostOutsideMetadata">
            <div class="shortsLockupViewModelHostOutsideMetadataTitle">${s.title}</div>
            <div class="shortsLockupViewModelHostMetadataSubhead">${s.channel}</div>
          </div>
        </ytm-shorts-lockup-view-model>
      `).join('');
    }

    renderFilterChips();
    renderFeeds();
  </script>
  <script src="extension/content.js"></script>
</body>
</html>
